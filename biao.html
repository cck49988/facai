<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发财~多期连排版</title>
<style>
    /* 核心：防止手机端出现左右滑动 */
    * {
        box-sizing: border-box;
    }
    body {
        background-color: #f5f5f5; 
        margin: 0;
        padding: 10px 0;
        font-family: "Microsoft YaHei", "宋体", sans-serif;
        overflow-x: hidden; /* 强制隐藏横向滚动条 */
    }
    
    /* ---------------- 顶部输入区 ---------------- */
    .control-panel {
        width: 95%;
        max-width: 420px;
        margin: 0 auto 10px auto;
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .control-panel textarea {
        width: 100%;
        height: 100px;
        padding: 8px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        font-family: monospace;
        line-height: 1.5;
        resize: none;
    }
    .tip {
        font-size: 12px; color: #666; margin-bottom: 5px;
    }
    .btn-group {
        display: flex;
        gap: 10px;
    }
    .control-panel button {
        flex: 1;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-update { background-color: #4CAF50; }
    .btn-download { background-color: #FF9800; }

    /* ---------------- 截图区域样式 ---------------- */
    .container {
        width: 95%;
        max-width: 420px; 
        margin: 0 auto; 
        background-color: #ffffff; 
        position: relative; 
        overflow: hidden; /* 防止内部内容溢出 */
    }
    
    /* 水印 */
    .watermark {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none; 
        z-index: 10; 
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><text x='50%' y='50%' font-size='14' font-weight='bold' fill='rgba(180, 180, 180, 0.2)' transform='rotate(-30 45 45)' text-anchor='middle'>米多多</text></svg>");
        background-repeat: repeat;
    }
    
    /* 表格基础样式 */
    .qxtable {
        font-size: 15px; 
        line-height: 1.4;
        font-weight: bold; 
        border-collapse: collapse; 
        position: relative;
        z-index: 1; 
        width: 100%;
        table-layout: fixed; /* 强制表格固定宽度，不因内容撑破 */
        word-wrap: break-word; /* 允许内容换行，防止撑破 */
    }
    .qxtable td {
        padding: 6px 4px; 
        border: 1px solid #000000; 
    }

    /* 高亮特效 */
    .hit-box {
        background-color: #FFFF00; 
        color: #FF0000 !important; 
        box-shadow: 0 0 5px #FFFF00; 
        display: inline; 
        padding: 0 2px;
        margin: 0;
        border-radius: 2px;
    }
</style>

<!-- 引入 html2canvas 截图库 -->
<script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- ================= 网页修改面板 ================= -->
<div class="control-panel">
    <div class="tip">
        <b>格式：</b>期数|标语|六肖|号码|开[生肖][号码] 或写“挂”<br>
        例如：<br>
        302期|发财机会天天见|牛鸡猪狗马鼠|06 46 44 21 25 43|开牛06<br>
        303期|发财机会天天见|鼠牛虎兔龙蛇|01 12 23 34 45 56|挂
    </div>
    <textarea id="in_data" oninput="saveData()"></textarea>
    <div class="btn-group">
        <button class="btn-update" onclick="updateTable()">更新连排</button>
        <button class="btn-download" onclick="downloadImage()" id="btnDownload">保存高清图</button>
    </div>
</div>
<!-- ==================================================================== -->


<!-- 下面的代码是表格排版 -->
<div class="container" id="screenshot-area">
    
    <!-- 水印层 -->
    <div class="watermark"></div>

    <!-- 动态生成的表格会塞进这里 -->
    <div id="output-area"></div>
</div>

<!-- ================= 自动计算与保存图片逻辑 ================= -->
<script>
    // 保存数据到本地
    function saveData() {
        localStorage.setItem('myLotteryDataFinal', document.getElementById('in_data').value);
    }

    // 页面加载
    window.onload = function() {
        var savedData = localStorage.getItem('myLotteryDataFinal');
        if (savedData) {
            document.getElementById('in_data').value = savedData;
        } else {
            // 默认演示数据
            document.getElementById('in_data').value = 
"302期|发财机会天天见,专业服务不打烊|牛鸡猪狗马鼠|06 46 44 21 25 43|开牛06\n" +
"303期|专业服务不打烊|鼠牛虎兔龙蛇|01 12 23 34 45 56|挂";
        }
        updateTable(); 
    };

    // 核心生成逻辑
    function updateTable() {
        var rawData = document.getElementById('in_data').value;
        var lines = rawData.split('\n');
        var outputHTML = '';
        var validLines = [];

        // 1. 先过滤出所有不是“挂”的期数
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line === '') continue; 

            var parts = line.split('|');
            if (parts.length < 5) continue;

            var status = parts[4].trim(); 
            if (status === '挂') continue; // 遇到挂直接跳过
            
            validLines.push(parts);
        }

        // 2. 如果没有中奖的，提示
        if (validLines.length === 0) {
            document.getElementById('output-area').innerHTML = '<div style="text-align:center; padding: 20px; color:#333;">没有中奖记录。</div>';
            return;
        }

        // 3. 渲染合并后的大表格
        outputHTML += `<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" class="qxtable"><tbody>`;

        for (var j = 0; j < validLines.length; j++) {
            var parts = validLines[j];
            var qishu = parts[0];
            var biaoyu = parts[1];
            var liuxiao = parts[2].trim();
            var liuma = parts[3].trim();
            var status = parts[4].trim(); 
            
            // 解析开奖数据
            var hitZodiac = "";
            var hitNumber = "";
            var zodiacMatch = status.match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/);
            if (zodiacMatch) hitZodiac = zodiacMatch[0];
            var numberMatch = status.match(/\d+/);
            if (numberMatch) hitNumber = numberMatch[0];

            // 高亮渲染
            function renderZodiac(str) {
                if (!hitZodiac) return `<font color="#FF0000">${str}</font>`;
                var regex = new RegExp(hitZodiac, 'g');
                var newStr = str.replace(regex, `<span class="hit-box">${hitZodiac}</span>`);
                return `<font color="#FF0000">${newStr}</font>`;
            }

            function renderNumber(str) {
                if (!hitNumber) return `<font color="#FF0000">${str}</font>`;
                var regex = new RegExp(`(^|\\s)(${hitNumber})(?=\\s|$)`, 'g');
                var newStr = str.replace(regex, `$1<span class="hit-box">$2</span>`);
                return `<font color="#FF0000">${newStr}</font>`;
            }

            // 截取
            var sixiao = liuxiao.substring(0, 4);
            var erxiao = liuxiao.substring(0, 2);
            var yixiao = liuxiao.substring(0, 1);
            
            var maArray = liuma.split(/[\s,]+/);
            var sima = maArray.slice(0, 6).join(" ");
            var erma = maArray.slice(0, 3).join(" ");
            var yima = maArray[0] || "";

            // 每一期的内部行
            outputHTML += `
                <tr>
                    <td style="text-align:center;background:#e1f0ff" width="100%" colspan="2" height="32">
                        <span>${qishu}</span>:<span>${biaoyu}</span>
                    </td>
                </tr>
                <tr>
                    <td style="text-align:left" bgcolor="#F4F4F4" width="48%" height="32">
                        <font color="#000080">六肖:</font>${renderZodiac(liuxiao)}
                    </td>
                    <td style="text-align:left" bgcolor="#F4F4F4" height="32">
                        <font color="#000080">6码:</font>${renderNumber(sima)}
                    </td>
                </tr>
                <tr>
                    <td style="text-align:left" bgcolor="#F4F4F4" width="48%" height="32">
                        <font color="#000080">四肖:</font>${renderZodiac(sixiao)}
                    </td>
                    <td style="text-align:left" bgcolor="#F4F4F4" height="32">
                        <font color="#000080">4码:</font>${renderNumber(maArray.slice(0, 4).join(" "))}
                    </td>
                </tr>
                <tr>
                    <td style="text-align:left" bgcolor="#F4F4F4" width="48%" height="32">
                        <font color="#000080">二肖:</font>${renderZodiac(erxiao)}
                    </td>
                    <td style="text-align:left" bgcolor="#F4F4F4" height="32">
                        <font color="#000080">2码:</font>${renderNumber(erma)}
                    </td>
                </tr>
                <tr>
                    <td style="text-align:left" bgcolor="#F4F4F4" width="48%" height="32">
                        <font color="#000080">一肖:</font>${renderZodiac(yixiao)}<font color="#000080">~~稳准狠</font>
                    </td>
                    <td style="text-align:left" bgcolor="#F4F4F4" height="32">
                        <font color="#000080">1码:</font>${renderNumber(yima)}<font color="#000080">~~重点多压</font>
                    </td>
                </tr>
            `;
        }

        // 4. 无论多少期，只在最尾部加上这一个标语
        outputHTML += `
                <tr>
                    <td style="text-align:center;background:#e1f0ff" width="100%" colspan="2" height="32">
                        百万富翁零距离，精彩服务百分百！
                    </td>
                </tr>
            </tbody>
        </table>`;

        document.getElementById('output-area').innerHTML = outputHTML;
    }

    // 保存为图片的功能
    function downloadImage() {
        var btn = document.getElementById('btnDownload');
        btn.innerText = "正在生成...";
        btn.disabled = true;

        var element = document.getElementById('screenshot-area');
        
        html2canvas(element, {
            scale: 3, 
            backgroundColor: "#ffffff", 
            useCORS: true
        }).then(function(canvas) {
            var imgData = canvas.toDataURL("image/png");
            var link = document.createElement('a');
            link.download = '连中战绩_资料.png';
            link.href = imgData;
            link.click();

            btn.innerText = "保存高清图";
            btn.disabled = false;
        }).catch(function(error) {
            alert("生成图片失败，请确保网络畅通！");
            btn.innerText = "保存高清图";
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
