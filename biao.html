<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>完美连中战绩生成器</title>
<style>
    body {
        background-color: #333; 
        margin: 0;
        padding: 10px 0;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
    }
    
    /* 顶部输入修改区 */
    .control-panel {
        width: 100%;
        max-width: 600px;
        margin: 0 auto 10px auto;
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        box-sizing: border-box;
    }
    .control-panel textarea {
        width: 100%;
        height: 120px; 
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 10px;
    }
    .control-panel button {
        width: 100%;
        padding: 12px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    .tip { font-size: 13px; color: #666; margin-bottom: 5px; line-height: 1.5;}
    .red-text { color: #d32f2f; font-weight: bold;}

    /* ---------------- 截图区域 ---------------- */
    .container {
        width: 100%;
        max-width: 600px; 
        margin: 0 auto; 
        background-color: #000000; 
        border: 2px solid #00ff00; 
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
    }

    /* 水印 */
    .watermark {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none; z-index: 10; 
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text x='50%' y='50%' font-size='14' font-weight='bold' fill='rgba(255, 255, 255, 0.05)' transform='rotate(-30 50 50)' text-anchor='middle'>米多多</text></svg>");
        background-repeat: repeat;
    }

    .period-block { 
        border-bottom: 2px solid #222; 
        padding-bottom: 5px;
        margin-bottom: 5px;
    }
    .period-block:last-child { border-bottom: none; }

    /* 顶部标题栏 */
    .top-title { 
        text-align: center; padding: 8px 0; font-size: 16px; font-weight: bold; 
        color: #00BFFF; background: linear-gradient(to bottom, #111, #000); 
        border-bottom: 1px solid #333; 
    }

    /* 数据行：坚决不换行 */
    .data-row { 
        display: flex; border-bottom: 1px solid #333; min-height: 45px; align-items: center; 
    }
    .data-row:last-child { border-bottom: none; }

    /* 左边占42% */
    .col-left { 
        width: 42%; padding: 0 5px; font-size: 18px; font-weight: bold; 
        display: flex; align-items: center; border-right: 1px solid #333; 
        box-sizing: border-box; white-space: nowrap; 
    }
    
    /* 右边占58% */
    .col-right { 
        width: 58%; padding: 0 5px; font-size: 17px; font-weight: bold; 
        display: flex; align-items: center; 
        box-sizing: border-box; white-space: nowrap; 
    }
    
    .label-left { color: #FFFFFF; margin-right: 3px; white-space: nowrap; font-size: 17px;}
    .txt-zodiac { color: #FF0000; letter-spacing: -0.5px;} /* 微调字间距 */
    
    .label-right { color: #00FF00; margin-right: 3px; white-space: nowrap; font-size: 17px;} 
    .txt-number { color: #FF0000; font-size: 16px; } /* 数字缩小1px */
    .txt-suffix { color: #CC00FF; font-size: 11px; font-weight: normal; margin-left: 3px; white-space: nowrap;} 

    /* 高亮样式 */
    .hit-box {
        background-color: #FFFF00; 
        color: #FF0000 !important; 
        box-shadow: 0 0 8px #FFFF00; 
        display: inline; 
        padding: 0; margin: 0;
    }

    /* 底部标语 */
    .bottom-title { 
        text-align: center; padding: 10px 0; font-size: 16px; font-weight: bold; 
        color: #FF0000; background-color: #050505; border-top: 1px solid #222; 
    }
    
    /* 底部高亮专属样式 */
    .highlight-yellow-box {
        background-color: #FFFF00;
        color: #FF0000 !important;
        padding: 0 4px;
        margin: 0 2px;
        display: inline-block;
        border-radius: 2px;
    }
</style>
</head>
<body>

<!-- ================= 网页修改面板 ================= -->
<div class="control-panel">
    <div class="tip">
        <b>格式：</b>期数|标语|六肖|6个号码|底部标语|中或挂|开[生肖][号码]<br>
        <span class="red-text">示例：305期|昨天坐地铁...|兔虎蛇羊鸡马|30.06.47.11.41.27|内幕资料 &lt;26中&gt; 为民造福!|中|开蛇26</span>
    </div>
    <textarea id="in_data" oninput="saveData()"></textarea>
    <button onclick="generate()">生成连排（并自动保存）</button>
</div>

<!-- ================= 截图区域 ================= -->
<div class="container" id="screenshot-area">
    <div class="watermark"></div>
    <div id="output-area"></div>
</div>

<script>
    function saveData() {
        localStorage.setItem('myLotteryData', document.getElementById('in_data').value);
    }

    window.onload = function() {
        var savedData = localStorage.getItem('myLotteryData');
        if (savedData) {
            document.getElementById('in_data').value = savedData;
        } else {
            document.getElementById('in_data').value = 
"305期|昨天坐地铁打工,今天保时捷接送!|兔虎蛇羊鸡马|30.06.47.11.41.27|内幕资料 <26中> 为民造福!|中|开蛇26";
        }
        generate(); 
    };

    function generate() {
        var rawData = document.getElementById('in_data').value;
        var lines = rawData.split('\n');
        var outputHTML = '';

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line === '') continue; 

            var parts = line.split('|');
            if (parts.length < 6) continue;

            var qishu = parts[0];
            var title = parts[1];
            var liuxiao = parts[2].trim();
            var liuma = parts[3].trim();
            var bottom = parts[4]; 
            var status = parts[5].trim();
            
            var hitZodiac = "";
            var hitNumber = "";

            if (parts.length >= 7 && parts[6].trim() !== "") {
                var hitData = parts[6]; 
                var zodiacMatch = hitData.match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/);
                if (zodiacMatch) hitZodiac = zodiacMatch[0];
                
                var numberMatch = hitData.match(/\d+/);
                if (numberMatch) hitNumber = numberMatch[0];
            }

            if (status === '挂') continue; 

            function renderZodiac(str) {
                if (!hitZodiac) return `<span class="txt-zodiac">${str}</span>`;
                var regex = new RegExp(hitZodiac, 'g');
                var newStr = str.replace(regex, `<span class="hit-box">${hitZodiac}</span>`);
                return `<span class="txt-zodiac">${newStr}</span>`;
            }

            function renderNumber(str) {
                if (!hitNumber) return `<span class="txt-number">${str}</span>`;
                var regex = new RegExp(`(^|\\.)(${hitNumber})(?=\\.|$)`, 'g');
                var newStr = str.replace(regex, `$1<span class="hit-box">$2</span>`);
                return `<span class="txt-number">${newStr}</span>`;
            }

            var finalBottom = bottom;
            if (finalBottom.includes("<") && finalBottom.includes(">")) {
                finalBottom = finalBottom.replace(/<([^>]+)>/g, `<span class="highlight-yellow-box">&lt;$1&gt;</span>`);
            }

            var wuxiao = liuxiao.substring(0, 5);
            var sanxiao = liuxiao.substring(0, 3);
            var erxiao = liuxiao.substring(0, 2);
            
            var maArray = liuma.split(/[\s,.]+/);
            var wuma = maArray.slice(0, 5).join(".");
            var sanma = maArray.slice(0, 3).join(".");
            var erma = maArray.slice(0, 2).join(".");

            outputHTML += `
            <div class="period-block">
                <div class="top-title">${qishu}:${title}</div>
                
                <div class="data-row">
                    <div class="col-left"><span class="label-left">六肖:</span>${renderZodiac(liuxiao)}</div>
                    <div class="col-right"><span class="label-right">⑥码:</span>${renderNumber(liuma)}</div>
                </div>
                
                <div class="data-row">
                    <div class="col-left"><span class="label-left">五肖:</span>${renderZodiac(wuxiao)}</div>
                    <div class="col-right"><span class="label-right">⑤码:</span>${renderNumber(wuma)}</div>
                </div>
                
                <div class="data-row">
                    <div class="col-left"><span class="label-left">三肖:</span>${renderZodiac(sanxiao)}<span class="txt-suffix">~轻松中</span></div>
                    <div class="col-right"><span class="label-right">③码:</span>${renderNumber(sanma)}<span class="txt-suffix">~小投注轻松玩</span></div>
                </div>
                
                <div class="data-row">
                    <div class="col-left"><span class="label-left">二肖:</span>${renderZodiac(erxiao)}<span class="txt-suffix">~一注出奇迹</span></div>
                    <div class="col-right"><span class="label-right">②码:</span>${renderNumber(erma)}<span class="txt-suffix">~运气来了挡不住</span></div>
                </div>
                
                <div class="bottom-title">
                    ${qishu}:${finalBottom}
                </div>
            </div>
            `;
        }

        if(outputHTML === '') {
            outputHTML = '<div style="color:#fff; text-align:center; padding: 20px;">全部都是“挂”，没有可以显示的数据。</div>';
        }

        document.getElementById('output-area').innerHTML = outputHTML;
    }
</script>

</body>
</html>
